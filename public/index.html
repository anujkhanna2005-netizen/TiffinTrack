<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TiffinTrack — Campus Tiffin & Meal Management Platform</title>
  <meta name="description" content="TiffinTrack helps PG and college students subscribe to local hygienic tiffin vendors, customize meals, track deliveries, and unlock flat group savings." />
  
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet" />
  
  <!-- Tailwind CDN with Design System Config -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary": "#15803d",
            "primary-dark": "#00652c",
            "on-primary": "#ffffff",
            "primary-container": "#15803d",
            "on-primary-container": "#d3ffd5",
            "primary-fixed": "#95f8a7",
            "primary-fixed-dim": "#79db8d",
            "secondary": "#006c49",
            "on-secondary": "#ffffff",
            "secondary-container": "#6cf8bb",
            "on-secondary-container": "#00714d",
            "tertiary": "#7b4d00",
            "on-tertiary": "#ffffff",
            "tertiary-container": "#9c6300",
            "on-tertiary-container": "#fff2e7",
            "surface": "#faf8ff",
            "surface-dim": "#d2d9f4",
            "surface-bright": "#faf8ff",
            "surface-container-lowest": "#ffffff",
            "surface-container-low": "#f2f3ff",
            "surface-container": "#eaedff",
            "surface-container-high": "#e2e7ff",
            "surface-container-highest": "#dae2fd",
            "surface-variant": "#dae2fd",
            "on-surface": "#131b2e",
            "on-surface-variant": "#3f493f",
            "background": "#faf8ff",
            "outline": "#6f7a6e",
            "outline-variant": "#becabc",
            "error": "#ba1a1a",
            "error-container": "#ffdad6",
            "on-error-container": "#93000a"
          },
          fontFamily: {
            "sans": ["Inter", "system-ui", "sans-serif"],
            "heading": ["Plus Jakarta Sans", "Inter", "sans-serif"],
            "headline-xl": ["Plus Jakarta Sans"],
            "headline-lg": ["Plus Jakarta Sans"],
            "headline-md": ["Plus Jakarta Sans"],
            "headline-sm": ["Plus Jakarta Sans"],
            "body-lg": ["Inter"],
            "body-md": ["Inter"],
            "body-sm": ["Inter"],
            "label-lg": ["Inter"],
            "label-md": ["Inter"],
            "label-sm": ["Inter"],
            "kpi-number": ["Plus Jakarta Sans"]
          },
          borderRadius: {
            "sm": "0.25rem",
            "DEFAULT": "0.5rem",
            "md": "0.75rem",
            "lg": "1rem",
            "xl": "1.5rem",
            "full": "9999px"
          }
        }
      }
    };
  </script>

  <!-- App Stylesheet -->
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="bg-[#faf8ff] text-[#131b2e] antialiased min-h-screen font-sans">

  <!-- App Shell -->
  <div id="app" class="min-h-screen flex flex-col">

    <!-- Top Navigation Bar (Design System Glassmorphism) -->
    <nav id="navbar" class="navbar hidden" role="navigation" aria-label="Main navigation">
      <div class="navbar-brand" onclick="currentRole && navigateTo(navConfig[currentRole][0].page)" style="cursor:pointer" role="button" tabindex="0" aria-label="TiffinTrack home">
        <div class="brand-logo-container">
          <span class="brand-emblem-icon">🍱</span>
        </div>
        <div class="flex flex-col">
          <span class="brand-name">TiffinTrack</span>
          <span class="brand-subtitle">Campus Dining</span>
        </div>
      </div>
      
      <ul id="nav-links" class="nav-links" role="menubar"></ul>
      
      <div class="navbar-right">
        <span id="nav-role-badge" class="role-badge" aria-live="polite"></span>
        <button id="btn-switch-role" class="btn btn-outline btn-sm" onclick="handleLogout()" aria-label="Sign out">
          <span class="material-symbols-outlined text-[16px] mr-1 align-middle">logout</span>
          <span>Log Out</span>
        </button>
        <button class="hamburger" id="hamburger-btn" onclick="toggleMobileNav()" aria-label="Toggle navigation menu" aria-expanded="false">
          <span></span><span></span><span></span>
        </button>
      </div>
    </nav>

    <!-- Main Content Area -->
    <main id="main-content" class="main-content flex-1 w-full" role="main" aria-live="polite">
      <!-- Pages are injected dynamically here -->
    </main>

  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" role="status" aria-live="polite" aria-atomic="false"></div>

  <!-- Back to Top Button -->
  <button id="back-to-top" onclick="window.scrollTo({top:0,behavior:'smooth'})" aria-label="Back to top" title="Back to top">
    <span class="material-symbols-outlined text-[20px]">arrow_upward</span>
  </button>

  <!-- Scripts with defer for non-blocking HTML parse — order preserved -->
  <script defer src="/js/service.js"></script>
  <script defer src="/js/pages/roleSwitcher.js"></script>
  <script defer src="/js/pages/studentDashboard.js"></script>
  <script defer src="/js/pages/findTiffin.js"></script>
  <script defer src="/js/pages/vendorDetails.js"></script>
  <script defer src="/js/pages/mySubscription.js"></script>
  <script defer src="/js/pages/todayMeal.js"></script>
  <script defer src="/js/pages/studentRatings.js"></script>
  <script defer src="/js/pages/studentComplaints.js"></script>
  <script defer src="/js/pages/vendorDashboard.js"></script>
  <script defer src="/js/pages/vendorMealPlans.js"></script>
  <script defer src="/js/pages/vendorMenu.js"></script>
  <script defer src="/js/pages/vendorSubscribers.js"></script>
  <script defer src="/js/pages/vendorDeliveries.js"></script>
  <script defer src="/js/pages/vendorRatings.js"></script>
  <script defer src="/js/pages/vendorComplaints.js"></script>
  <script defer src="/js/pages/adminDashboard.js"></script>
  <script defer src="/js/pages/adminSubscriptions.js"></script>
  <script defer src="/js/pages/adminVendors.js"></script>
  <script defer src="/js/pages/adminCustomers.js"></script>
  <script defer src="/js/pages/adminComplaints.js"></script>
  <script defer src="/js/pages/adminRatings.js"></script>
  <script defer src="/js/pages/dbmsDemo.js"></script>
  <!-- app.js must load last -->
  <script defer src="/js/app.js"></script>

</body>
</html>
